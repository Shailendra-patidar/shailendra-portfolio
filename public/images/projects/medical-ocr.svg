<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="100%" stop-color="#12141d"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5e8c7"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa820a"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad2)"/>
  <rect width="800" height="500" fill="none" stroke="#d4af37" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Scanning Ray effect -->
  <line x1="100" y1="210" x2="700" y2="210" stroke="#d4af37" stroke-width="2" stroke-opacity="0.7" filter="url(#glow2)"/>
  <rect x="100" y="200" width="600" height="20" fill="#d4af37" fill-opacity="0.08" filter="url(#glow2)"/>

  <!-- Document Sheet representation -->
  <rect x="240" y="80" width="320" height="260" rx="6" fill="#13141c" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
  <rect x="270" y="110" width="140" height="12" rx="3" fill="#d4af37" fill-opacity="0.8"/>
  
  <!-- OCR Bounding boxes -->
  <rect x="270" y="140" width="260" height="18" rx="2" fill="none" stroke="#d4af37" stroke-dasharray="3 3" stroke-width="1.2"/>
  <rect x="275" y="145" width="90" height="8" rx="2" fill="#ffffff" fill-opacity="0.4"/>
  <rect x="440" y="145" width="40" height="8" rx="2" fill="#d4af37"/>
  <text x="510" y="152" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600">NORMAL</text>

  <rect x="270" y="170" width="260" height="18" rx="2" fill="none" stroke="#e11d48" stroke-dasharray="3 3" stroke-width="1.2"/>
  <rect x="275" y="175" width="110" height="8" rx="2" fill="#ffffff" fill-opacity="0.4"/>
  <rect x="440" y="175" width="45" height="8" rx="2" fill="#e11d48"/>
  <text x="510" y="182" fill="#e11d48" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600">HIGH</text>

  <rect x="270" y="200" width="260" height="18" rx="2" fill="none" stroke="#d4af37" stroke-dasharray="3 3" stroke-width="1.2"/>
  <rect x="275" y="205" width="80" height="8" rx="2" fill="#ffffff" fill-opacity="0.4"/>
  <rect x="440" y="205" width="35" height="8" rx="2" fill="#d4af37"/>
  <text x="510" y="212" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600">NORMAL</text>

  <rect x="270" y="235" width="260" height="80" rx="4" fill="#0d0e14" stroke="#d4af37" stroke-opacity="0.2"/>
  <text x="285" y="258" fill="#d4af37" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">LLM CLINICAL SYNTHESIS</text>
  <rect x="285" y="270" width="210" height="6" rx="2" fill="#ffffff" fill-opacity="0.25"/>
  <rect x="285" y="284" width="230" height="6" rx="2" fill="#ffffff" fill-opacity="0.25"/>
  <rect x="285" y="298" width="150" height="6" rx="2" fill="#ffffff" fill-opacity="0.25"/>

  <!-- Top Badges -->
  <rect x="50" y="45" width="160" height="28" rx="14" fill="#181822" stroke="#d4af37" stroke-opacity="0.3"/>
  <text x="130" y="63" fill="#d4af37" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">PADDLEOCR + LLM</text>

  <!-- Platform Card Overlay -->
  <rect x="50" y="380" width="700" height="80" rx="8" fill="#101017" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="80" y="415" fill="#f5f2eb" font-family="'Playfair Display', serif" font-size="20" font-weight="600">Medical Report Analysis</text>
  <text x="80" y="440" fill="#8e8a7e" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Automated Biometric OCR • Range Cross-Referencing • Natural Language Insights</text>
  <circle cx="700" cy="420" r="6" fill="#d4af37"/>
  <text x="680" y="424" fill="#d4af37" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="end">PARSED</text>
</svg>
