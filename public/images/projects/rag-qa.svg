<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0d"/>
      <stop offset="100%" stop-color="#13151f"/>
    </linearGradient>
    <linearGradient id="goldGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5e8c7"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa820a"/>
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad4)"/>
  <rect width="800" height="500" fill="none" stroke="#d4af37" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Pipeline Diagram Nodes -->
  <!-- Node 1: Ingestion -->
  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="110" height="90" rx="8" fill="#11121a" stroke="#d4af37" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="55" y="35" fill="#f5f2eb" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Documents</text>
    <text x="55" y="55" fill="#8e8a7e" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-anchor="middle">PDF • TXT</text>
    <circle cx="55" cy="72" r="4" fill="#d4af37"/>
  </g>

  <!-- Arrow 1 -->
  <path d="M210 205 L260 205" stroke="#d4af37" stroke-width="1.8" stroke-dasharray="4 3"/>

  <!-- Node 2: Chunking & Embeddings -->
  <g transform="translate(260, 160)">
    <rect x="0" y="0" width="120" height="90" rx="8" fill="#11121a" stroke="#d4af37" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="60" y="35" fill="#f5f2eb" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Embeddings</text>
    <text x="60" y="55" fill="#8e8a7e" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-anchor="middle">Dense Vectors</text>
    <circle cx="60" cy="72" r="4" fill="#d4af37" filter="url(#glow4)"/>
  </g>

  <!-- Arrow 2 -->
  <path d="M380 205 L430 205" stroke="#d4af37" stroke-width="1.8" stroke-dasharray="4 3"/>

  <!-- Node 3: Vector Search -->
  <g transform="translate(430, 160)">
    <rect x="0" y="0" width="120" height="90" rx="8" fill="#151722" stroke="#d4af37" stroke-width="2" filter="url(#glow4)"/>
    <text x="60" y="35" fill="#f5e8c7" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Similarity Search</text>
    <text x="60" y="55" fill="#d4af37" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-anchor="middle">Cosine Top-K</text>
    <circle cx="60" cy="72" r="5" fill="#10b981"/>
  </g>

  <!-- Arrow 3 -->
  <path d="M550 205 L600 205" stroke="#d4af37" stroke-width="1.8" stroke-dasharray="4 3"/>

  <!-- Node 4: Generation -->
  <g transform="translate(600, 160)">
    <rect x="0" y="0" width="110" height="90" rx="8" fill="#11121a" stroke="#d4af37" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="55" y="35" fill="#f5f2eb" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Grounded LLM</text>
    <text x="55" y="55" fill="#8e8a7e" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-anchor="middle">Cited Response</text>
    <circle cx="55" cy="72" r="4" fill="#d4af37"/>
  </g>

  <!-- Top Badges -->
  <rect x="50" y="45" width="200" height="28" rx="14" fill="#181822" stroke="#d4af37" stroke-opacity="0.3"/>
  <text x="150" y="63" fill="#d4af37" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">RETRIEVAL-AUGMENTED GEN</text>

  <!-- Platform Card Overlay -->
  <rect x="50" y="380" width="700" height="80" rx="8" fill="#101017" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="80" y="415" fill="#f5f2eb" font-family="'Playfair Display', serif" font-size="20" font-weight="600">RAG Document Question Answering System</text>
  <text x="80" y="440" fill="#8e8a7e" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Sliding Window Chunking • Semantic Vector Embedding • Hallucination-Guarded Retrieval</text>
  <circle cx="700" cy="420" r="6" fill="#10b981"/>
  <text x="680" y="424" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="end">INDEXED</text>
</svg>
