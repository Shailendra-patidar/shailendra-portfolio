<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0e"/>
      <stop offset="100%" stop-color="#14141d"/>
    </linearGradient>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5e8c7"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa820a"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad1)"/>
  <rect width="800" height="500" fill="none" stroke="#d4af37" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Grid lines -->
  <path d="M50 0 v500 M150 0 v500 M250 0 v500 M350 0 v500 M450 0 v500 M550 0 v500 M650 0 v500 M750 0 v500" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
  <path d="M0 50 h800 M0 150 h800 M0 250 h800 M0 350 h800 M0 450 h800" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>

  <!-- Ambient Light -->
  <circle cx="400" cy="220" r="160" fill="#d4af37" fill-opacity="0.06" filter="url(#glow1)"/>

  <!-- Healthcare Cross & Pulse Interface -->
  <g transform="translate(400, 210)">
    <!-- Outer Orbit Ring -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="#d4af37" stroke-opacity="0.2" stroke-dasharray="4 8"/>
    <circle cx="0" cy="0" r="100" fill="#0f0f16" stroke="#d4af37" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Medical Cross -->
    <path d="M-15 -45 h30 v30 h30 v30 h-30 v30 h-30 v-30 h-30 v-30 h30 z" fill="url(#goldGrad1)" filter="url(#glow1)"/>

    <!-- Pulse Line Graphic -->
    <path d="M-280 90 L-140 90 L-100 90 L-70 50 L-40 130 L-10 60 L15 110 L40 90 L180 90 L280 90" fill="none" stroke="#d4af37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  </g>

  <!-- Top Badges -->
  <rect x="50" y="45" width="130" height="28" rx="14" fill="#181822" stroke="#d4af37" stroke-opacity="0.3"/>
  <text x="115" y="63" fill="#d4af37" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">FASTAPI + RAG</text>

  <!-- Platform Card Overlay -->
  <rect x="50" y="380" width="700" height="80" rx="8" fill="#101017" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="80" y="415" fill="#f5f2eb" font-family="'Playfair Display', serif" font-size="20" font-weight="600">CallDR: Smart Healthcare Platform</text>
  <text x="80" y="440" fill="#8e8a7e" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Contextual Triage • Validated Clinical RAG • Asynchronous Architecture</text>
  <circle cx="700" cy="420" r="6" fill="#10b981"/>
  <text x="680" y="424" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="end">ACTIVE ENGINE</text>
</svg>
