<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#151218"/>
    </linearGradient>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5e8c7"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa820a"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad3)"/>
  <rect width="800" height="500" fill="none" stroke="#d4af37" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Coordinate scatter plot frame -->
  <rect x="180" y="90" width="440" height="240" fill="#0f0f15" stroke="#ffffff" stroke-opacity="0.08" rx="6"/>
  
  <!-- Grid in scatter plot -->
  <line x1="180" y1="150" x2="620" y2="150" stroke="#ffffff" stroke-opacity="0.04"/>
  <line x1="180" y1="210" x2="620" y2="210" stroke="#ffffff" stroke-opacity="0.04"/>
  <line x1="180" y1="270" x2="620" y2="270" stroke="#ffffff" stroke-opacity="0.04"/>
  <line x1="290" y1="90" x2="290" y2="330" stroke="#ffffff" stroke-opacity="0.04"/>
  <line x1="400" y1="90" x2="400" y2="330" stroke="#ffffff" stroke-opacity="0.04"/>
  <line x1="510" y1="90" x2="510" y2="330" stroke="#ffffff" stroke-opacity="0.04"/>

  <!-- Decision Boundary Line -->
  <path d="M200 310 C320 280, 390 190, 600 110" fill="none" stroke="#d4af37" stroke-width="2" stroke-dasharray="6 4" filter="url(#glow3)"/>

  <!-- Cluster 0: Healthy points (Ivory / Green subtle) -->
  <circle cx="230" cy="270" r="5" fill="#10b981" opacity="0.8"/>
  <circle cx="260" cy="290" r="6" fill="#10b981" opacity="0.8"/>
  <circle cx="310" cy="250" r="5" fill="#10b981" opacity="0.8"/>
  <circle cx="280" cy="220" r="6" fill="#10b981" opacity="0.8"/>
  <circle cx="350" cy="240" r="5" fill="#10b981" opacity="0.8"/>
  <circle cx="380" cy="230" r="6" fill="#10b981" opacity="0.8"/>
  <circle cx="330" cy="270" r="5" fill="#10b981" opacity="0.8"/>

  <!-- Cluster 1: Risk points (Rose / Bronze) -->
  <circle cx="450" cy="160" r="6" fill="#f43f5e" opacity="0.85"/>
  <circle cx="490" cy="140" r="5" fill="#f43f5e" opacity="0.85"/>
  <circle cx="530" cy="180" r="6" fill="#f43f5e" opacity="0.85"/>
  <circle cx="560" cy="130" r="5" fill="#f43f5e" opacity="0.85"/>
  <circle cx="470" cy="190" r="5" fill="#f43f5e" opacity="0.85"/>
  <circle cx="580" cy="160" r="6" fill="#f43f5e" opacity="0.85"/>

  <!-- Target Point Being Evaluated (KNN inquiry point) -->
  <circle cx="410" cy="205" r="9" fill="#d4af37" filter="url(#glow3)"/>
  <circle cx="410" cy="205" r="28" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.9"/>
  <!-- Distance Vectors to neighbors -->
  <line x1="410" y1="205" x2="380" y2="230" stroke="#d4af37" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="410" y1="205" x2="350" y2="240" stroke="#d4af37" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="410" y1="205" x2="450" y2="160" stroke="#d4af37" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Top Badges -->
  <rect x="50" y="45" width="180" height="28" rx="14" fill="#181822" stroke="#d4af37" stroke-opacity="0.3"/>
  <text x="140" y="63" fill="#d4af37" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">SCIKIT-LEARN • KNN</text>

  <!-- Platform Card Overlay -->
  <rect x="50" y="380" width="700" height="80" rx="8" fill="#101017" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="80" y="415" fill="#f5f2eb" font-family="'Playfair Display', serif" font-size="20" font-weight="600">Heart Disease Prediction</text>
  <text x="80" y="440" fill="#8e8a7e" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Feature Normalization • K-Nearest Neighbors Classifier • Streamlit Interactive Interface</text>
  <circle cx="700" cy="420" r="6" fill="#10b981"/>
  <text x="680" y="424" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="end">ACCURATE</text>
</svg>
